<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ലാഇലാഹ ഇല്ലല്ലാഹ് - ശർത്തുകൾ ക്വിസ്</title>
<style>
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);--bg:#f6f7f2;--card:#fff;--tx:#1d2b22;--mu:#667;--ac:#1f7a4d;--ok:#d9f2e3;--no:#fbdada;--bd:#d8ddd2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1e2721;--tx:#e8efe9;--mu:#9aa89e;--ac:#4cc38a;--ok:#1d4a33;--no:#52252a;--bd:#34413a}}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Malayalam",sans-serif;line-height:1.6}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.15rem;margin:8px 0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.q{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.o{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.o.ok{background:var(--ok);border-color:var(--ac)}.o.no{background:var(--no)}
.b{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;margin-top:12px}
.m{color:var(--mu);font-size:.9rem}
.big{font-size:2.4rem;font-weight:700;color:var(--ac);text-align:center}
.r{border-top:1px solid var(--bd);padding:8px 0;font-size:.95rem}
</style></head><body><div class="w">
<h1>ശുറൂത്വു ലാഇലാഹ ഇല്ലല്ലാഹ് – ക്വിസ്</h1>
<div class="bar"><i id="p"></i></div>
<div id="a"></div></div>
<script>
const Q=[
["ലാഇലാഹ ഇല്ലല്ലാഹിന്റെ ഒന്നാമത്തെ ശർത്ത്?",["അറിവ്","സ്നേഹം","ഇഖ്‌ലാസ്","സത്യസന്ധത"]],
["\"അറിവ്\" എന്നതിന്റെ താൽപര്യം?",["അർഥവും ആശയവും സംശയലേശമന്യേ ബോധ്യപ്പെടുക","വാക്ക് മനഃപാഠമാക്കുക","അറബിയിൽ മാത്രം പഠിക്കുക","ആവർത്തിച്ച് ചൊല്ലുക"]],
["മുസ്‌ലിമിലെ ഹദീസ് പ്രകാരം ആരാണ് സ്വർഗത്തിൽ പ്രവേശിച്ചത്?",["ആരാധനക്കർഹൻ അല്ലാഹു മാത്രമെന്ന് അറിഞ്ഞ് മരിച്ചവൻ","രാത്രി നമസ്കരിച്ചവൻ","എന്നും നോമ്പെടുത്തവൻ","ദിവസവും ഖുർആൻ ഓതിയവൻ"]],
["രണ്ടാമത്തെ ശർത്ത്?",["ദൃഢവിശ്വാസം (യഖീൻ)","സ്വീകരണം","സ്നേഹം","അറിവ്"]],
["യഖീൻ എന്നാൽ?",["ചാഞ്ചല്യമില്ലാത്ത ഉറച്ച വിശ്വാസം","ശക്തമായ പ്രതീക്ഷ","ഓർമ്മശക്തി","ഭൂരിപക്ഷത്തെ പിന്തുടരൽ"]],
["ഹൃദയത്തിൽ വിശ്വാസമില്ലാതെ ആയിരം തവണ ചൊല്ലിയാൽ?",["വിശ്വാസം പൂർത്തിയാവില്ല","വിശ്വാസം പൂർത്തിയാകും","ഇരട്ടി പ്രതിഫലം ലഭിക്കും","പണ്ഡിതനാകും"]],
["അബൂഹുറയ്റ(റ)യോട് ആരെ സ്വർഗം കൊണ്ട് സന്തോഷവാർത്ത അറിയിക്കാനാണ് നബി ﷺ പറഞ്ഞത്?",["ദൃഢവിശ്വാസത്തോടെ സാക്ഷ്യം വഹിച്ചവനെ","നോമ്പുകാരനെ","ദാനം ചെയ്തവനെ","ഹജ്ജ് ചെയ്തവനെ"]],
["മൂന്നാമത്തെ ശർത്ത്?",["ഇഖ്‌ലാസ്","സത്യസന്ധത","സ്നേഹം","സ്വീകരണം"]],
["ഇഖ്‌ലാസിന്റെ സാരം?",["കളങ്കരഹിതമായി അല്ലാഹുവിന് മാത്രം ആരാധന സമർപ്പിക്കൽ","ജമാഅത്തായി മാത്രം ആരാധിക്കൽ","റമദാനിൽ മാത്രം ആരാധിക്കൽ","പരസ്യമായി ആരാധിക്കൽ"]],
["സൂറതുൽ ബയ്യിന 98:5 പ്രകാരം അവർ കൽപിക്കപ്പെട്ടത്?",["കീഴ്‌വണക്കം അല്ലാഹുവിന് മാത്രമാക്കി ആരാധിക്കാനും നമസ്കാരം നിലനിർത്താനും സകാത്ത് നൽകാനും","നോമ്പ് മാത്രം അനുഷ്ഠിക്കാൻ","ഹജ്ജ് മാത്രം ചെയ്യാൻ","രഹസ്യമായി മാത്രം ആരാധിക്കാൻ"]],
["സൂറതുസ്സുമർ 39:54 പ്രകാരം രക്ഷിതാവിലേക്ക് മടങ്ങേണ്ടത് എപ്പോൾ?",["ശിക്ഷ വന്നെത്തുന്നതിനു മുമ്പ്","ശിക്ഷ വന്നശേഷം","വാർധക്യത്തിൽ മാത്രം","റമദാനിൽ മാത്രം"]],
["ബുഖാരി: ഖിയാമത്ത് നാളിൽ നബി ﷺ യുടെ ശുപാർശ ലഭിക്കാൻ ഏറ്റവും ഭാഗ്യമുള്ളവൻ?",["ഹൃദയത്തിൽ ഇഖ്‌ലാസോടെ ലാഇലാഹ ഇല്ലല്ലാഹ് മൊഴിഞ്ഞവൻ","പള്ളി പണിതവൻ","ധാരാളം മക്കളുള്ളവൻ","ധനികൻ"]],
["നാലാമത്തെ ശർത്ത്?",["സത്യസന്ധത (സ്വിദ്ഖ്)","സ്നേഹം","അറിവ്","യഖീൻ"]],
["സത്യസന്ധതയുടെ താൽപര്യം?",["വിശ്വാസത്തിലും ആദർശത്തിലും സത്യസന്ധത പുലർത്തുകയും ഖുർആനിലെയും തിരുചര്യയിലെയും കാര്യങ്ങൾ സത്യപ്പെടുത്തുകയും ചെയ്യുക","ഖുർആൻ മനഃപാഠമാക്കുക","മറ്റുള്ളവരെ പഠിപ്പിക്കുക","യാത്ര ഒഴിവാക്കുക"]],
["അഹ്മദിന്റെ ഹദീസ് പ്രകാരം സത്യസന്ധമായി ലാഇലാഹ ഇല്ലല്ലാഹ് പറഞ്ഞാൽ?",["സ്വർഗത്തിൽ പ്രവേശിക്കും","ധനികനാകും","ദുനിയാവിൽ പരീക്ഷിക്കപ്പെടും","ദുഃഖമുണ്ടാകില്ല"]],
["സൂറതുൽ അൻകബൂത്ത് 29:3 പ്രകാരം അല്ലാഹു അറിയുന്നത്?",["സത്യം പറഞ്ഞവരെയും കള്ളം പറയുന്നവരെയും","ധനികരെ മാത്രം","പണ്ഡിതരെ മാത്രം","യാത്രക്കാരെ മാത്രം"]],
["\"ഞങ്ങൾ അല്ലാഹുവിലും അന്ത്യദിനത്തിലും വിശ്വസിക്കുന്നു\" എന്ന് പറയുന്ന ചിലർ വിശ്വാസികളല്ല എന്ന് പറയുന്ന ആയത്ത്?",["സൂറതുൽ ബഖറ 2:8","സൂറതുൽ ബയ്യിന 98:5","സൂറതു മുഹമ്മദ് 47:19","സൂറതുസ്സുമർ 39:54"]],
["നാവുകൊണ്ട് ചൊല്ലി ഹൃദയവും പ്രവർത്തനവും യോജിപ്പിക്കാതിരിക്കൽ?",["കാപട്യം; അവിശ്വാസത്തെക്കാൾ ഗുരുതരം","അനുവദനീയം","ചെറിയ തെറ്റ്","പുണ്യകർമം"]],
["അഞ്ചാമത്തെ ശർത്ത്?",["സ്നേഹം (ഹുബ്ബ്)","അറിവ്","സ്വീകരണം","യഖീൻ"]],
["സ്നേഹം എന്ന ശർത്തിന്റെ ഉദ്ദേശം?",["അല്ലാഹു ഇഷ്ടപ്പെട്ടതിനെ ഇഷ്ടപ്പെടുകയും വെറുത്തതിനെ വെറുക്കുകയും, അവന്റെ ഇഷ്ടത്തിന് മുൻഗണന നൽകുകയും ചെയ്യുക","കുടുംബത്തെ മാത്രം സ്നേഹിക്കൽ","സമ്പത്തിനെ സ്നേഹിക്കൽ","പരസ്യമായി മാത്രം സ്നേഹിക്കൽ"]],
["സൂറതുൽ ബഖറ 2:165 പ്രകാരം സത്യവിശ്വാസികൾ?",["അല്ലാഹുവോട് അതിശക്തമായ സ്നേഹമുള്ളവർ","അല്ലാഹുവിന് സമന്മാരെ വെക്കുന്നവർ","സ്നേഹം കുറഞ്ഞവർ","നിസ്സംഗർ"]],
["ഈമാനിന്റെ മാധുര്യം അനുഭവിക്കാനുള്ള മൂന്ന് കാര്യങ്ങളിൽ ഒന്നാമത്തേത് (ബുഖാരി, മുസ്‌ലിം)?",["അല്ലാഹുവും റസൂലും മറ്റെന്തിനെക്കാളും പ്രിയപ്പെട്ടതാവുക","ധനികനാവുക","ആദരിക്കപ്പെടുക","വിദ്യാസമ്പന്നനാവുക"]],
["അബൂദാവൂദിന്റെ ഹദീസ്: അല്ലാഹുവിന് വേണ്ടി സ്നേഹിക്കുകയും വെറുക്കുകയും നൽകുകയും തടയുകയും ചെയ്താൽ?",["അവന്റെ വിശ്വാസം പൂർത്തിയായി","ആരാധന ഒഴിവാകും","ദുനിയാവിൽ വിജയിക്കും","ഒരു നന്മ മാത്രം ലഭിക്കും"]],
["ആറാമത്തെ ശർത്ത്?",["സ്വീകരിക്കലും കീഴ്പ്പെടലും","സത്യസന്ധത","സ്നേഹം","ഇഖ്‌ലാസ്"]],
["സൂറതുൽ അഹ്സാബ് 33:36 പ്രകാരം അല്ലാഹുവും റസൂലും ഒരു കാര്യത്തിൽ തീരുമാനമെടുത്താൽ വിശ്വാസികൾക്ക്?",["സ്വതന്ത്രമായ അഭിപ്രായം ഉണ്ടായിരിക്കാവുന്നതല്ല","സ്വന്തം അഭിപ്രായം പറയാം","തീരുമാനം വൈകിക്കാം","സുഹൃത്തുക്കളോട് ആലോചിക്കാം"]]
];
const A=document.getElementById('a'),P=document.getElementById('p');
let i=0,s=0,log=[],D;
function sh(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){i=0;s=0;log=[];D=Q.map(q=>({q:q[0],c:q[1][0],o:sh(q[1])}));show()}
function show(){
 if(i>=D.length)return end();
 P.style.width=(i/D.length*100)+'%';
 const d=D[i];
 A.innerHTML='<div class="c"><div class="m">ചോദ്യം '+(i+1)+' / '+D.length+'</div><p class="q">'+d.q+'</p>'+d.o.map((t,k)=>'<button class="o" data-k="'+k+'">'+t+'</button>').join('')+'<div id="n"></div></div>';
 A.querySelectorAll('.o').forEach(b=>b.onclick=()=>pick(b,d));
}
function pick(b,d){
 const bs=A.querySelectorAll('.o');
 bs.forEach(x=>{x.disabled=true;if(x.textContent===d.c)x.classList.add('ok')});
 const right=b.textContent===d.c;
 if(right)s++;else b.classList.add('no');
 log.push([d.q,b.textContent,d.c,right]);
 document.getElementById('n').innerHTML='<button class="b" id="nx">'+(i==D.length-1?'ഫലം കാണുക':'അടുത്തത്')+'</button>';
 document.getElementById('nx').onclick=()=>{i++;show()};
}
function end(){
 P.style.width='100%';
 const w=log.filter(l=>!l[3]);
 A.innerHTML='<div class="c"><div class="big">'+s+' / '+D.length+'</div><p class="m" style="text-align:center">'+(s>=22?'മാഷാ അല്ലാഹ്! മികച്ച പ്രകടനം':s>=15?'നല്ല പ്രകടനം, ഒന്നുകൂടി ഉറപ്പിക്കാം':'ഒന്നുകൂടി വായിച്ച് വീണ്ടും ശ്രമിക്കുക')+'</p>'+
 (w.length?'<h3>തെറ്റിയവ</h3>'+w.map(l=>'<div class="r"><b>'+l[0]+'</b><br>നിങ്ങളുടെ ഉത്തരം: '+l[1]+'<br>ശരി: '+l[2]+'</div>').join(''):'')+
 '<button class="b" id="re">വീണ്ടും ശ്രമിക്കുക</button></div>';
 document.getElementById('re').onclick=start;
}
start();
</script></body></html>
